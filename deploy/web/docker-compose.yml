services:
  web:
    image: ${WEB_IMAGE:-chadchat/web-next:latest}
    build:
      context: ../../web-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${WEB_PUBLIC_PORT:-3000}:3000"

  admin-web:
    image: ${ADMIN_WEB_IMAGE:-chadchat/admin-web:latest}
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PUBLIC_PORT:-8082}:80"
