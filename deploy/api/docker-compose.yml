services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"

  verification-service:
    image: ${VERIFICATION_SERVICE_IMAGE:-chadchat/verification-service:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/verification-service
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_DSN}
      PORT: 8082
      VERIFICATION_INTERNAL_SECRET: ${VERIFICATION_INTERNAL_SECRET}
    depends_on:
      - mysql
    expose:
      - "8082"

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-chadchat/auth-service:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/auth-service
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_DSN}
      PORT: 8081
      VERIFICATION_SERVICE_URL: http://verification-service:8082
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      VERIFICATION_INTERNAL_SECRET: ${VERIFICATION_INTERNAL_SECRET}
    depends_on:
      - mysql
      - verification-service
    expose:
      - "8081"

  ml-service:
    image: ${ML_SERVICE_IMAGE:-chadchat/ml-service:latest}
    build:
      context: ../../ml
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8090
    expose:
      - "8090"

  test-lab-service:
    image: ${TEST_LAB_SERVICE_IMAGE:-chadchat/test-lab-service:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/test-lab-service
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_DSN}
      PORT: 8083
      AUTH_SERVICE_URL: http://auth-service:8081
      ML_SERVICE_URL: http://ml-service:8090
    depends_on:
      - mysql
      - auth-service
      - ml-service
    expose:
      - "8083"

  live-chat-service:
    image: ${LIVE_CHAT_SERVICE_IMAGE:-chadchat/live-chat-service:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/live-chat-service
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_DSN}
      PORT: 8084
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      - mysql
      - auth-service
    expose:
      - "8084"

  duel-service:
    image: ${DUEL_SERVICE_IMAGE:-chadchat/duel-service:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/duel-service
    restart: unless-stopped
    environment:
      PORT: 8085
      AUTH_SERVICE_URL: http://auth-service:8081
      ML_SERVICE_URL: http://ml-service:8090
      CUSTOMIZATION_SERVICE_URL: http://customization-service:8087
      CUSTOMIZATION_INTERNAL_SECRET: ${CUSTOMIZATION_INTERNAL_SECRET}
      RATING_SERVICE_URL: http://rating-service:8086
      RATING_INTERNAL_SECRET: ${RATING_INTERNAL_SECRET}
      DEFAULT_RESULT_SOUND_URL: ${DEFAULT_RESULT_SOUND_URL}
    depends_on:
      - auth-service
      - ml-service
      - customization-service
      - rating-service
    expose:
      - "8085"

  customization-service:
    image: ${CUSTOMIZATION_SERVICE_IMAGE:-chadchat/customization-service:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/customization-service
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_DSN}
      PORT: 8087
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMIZATION_INTERNAL_SECRET: ${CUSTOMIZATION_INTERNAL_SECRET}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET}
      DEFAULT_RESULT_SOUND_URL: ${DEFAULT_RESULT_SOUND_URL}
    depends_on:
      - mysql
      - auth-service
    expose:
      - "8087"

  rating-service:
    image: ${RATING_SERVICE_IMAGE:-chadchat/rating-service:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/rating-service
    restart: unless-stopped
    environment:
      MYSQL_DSN: ${MYSQL_DSN}
      PORT: 8086
      AUTH_SERVICE_URL: http://auth-service:8081
      RATING_INTERNAL_SECRET: ${RATING_INTERNAL_SECRET}
      DEFAULT_QUEUE_TYPE: ${DEFAULT_QUEUE_TYPE}
      DEFAULT_REGION: ${DEFAULT_REGION}
    depends_on:
      - mysql
      - auth-service
    expose:
      - "8086"

  api-gateway:
    image: ${API_GATEWAY_IMAGE:-chadchat/api-gateway:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/api-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      VERIFICATION_SERVICE_URL: ${VERIFICATION_SERVICE_URL:-http://verification-service:8082}
      TEST_LAB_SERVICE_URL: ${TEST_LAB_SERVICE_URL:-http://test-lab-service:8083}
      LIVE_CHAT_SERVICE_URL: ${LIVE_CHAT_SERVICE_URL:-http://live-chat-service:8084}
      DUEL_SERVICE_URL: ${DUEL_SERVICE_URL:-http://duel-service:8085}
      CUSTOMIZATION_SERVICE_URL: ${CUSTOMIZATION_SERVICE_URL:-http://customization-service:8087}
      RATING_SERVICE_URL: ${RATING_SERVICE_URL:-http://rating-service:8086}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8090}
    depends_on:
      - auth-service
      - verification-service
      - test-lab-service
      - live-chat-service
      - duel-service
      - customization-service
      - rating-service
    ports:
      - "${API_PUBLIC_PORT:-8080}:8080"

volumes:
  mysql_data:
