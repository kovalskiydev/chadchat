version: "3.9"
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chadchat
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  verification-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/verification-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - VERIFICATION_INTERNAL_SECRET=dev-internal-secret-change-me
    depends_on:
      - mysql
    ports:
      - "8082:8082"

  auth-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/auth-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - VERIFICATION_SERVICE_URL=http://verification-service:8082
      - VERIFICATION_INTERNAL_SECRET=dev-internal-secret-change-me
    depends_on:
      - mysql
      - verification-service
    ports:
      - "8081:8081"

  ml-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install --no-cache-dir -r ml/requirements.txt && uvicorn ml.api:app --host 0.0.0.0 --port 8090"
    ports:
      - "8090:8090"

  test-lab-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/test-lab-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ML_SERVICE_URL=http://ml-service:8090
    depends_on:
      - mysql
      - auth-service
      - ml-service
    ports:
      - "8083:8083"

  live-chat-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/live-chat-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CUSTOMIZATION_SERVICE_URL=http://customization-service:8087
      - CUSTOMIZATION_INTERNAL_SECRET=dev-customization-secret-change-me
    depends_on:
      - mysql
      - auth-service
      - customization-service
    ports:
      - "8084:8084"


  duel-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/duel-service
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ML_SERVICE_URL=http://ml-service:8090
      - CUSTOMIZATION_SERVICE_URL=http://customization-service:8087
      - CUSTOMIZATION_INTERNAL_SECRET=dev-customization-secret-change-me
      - RATING_SERVICE_URL=http://rating-service:8086
      - RATING_INTERNAL_SECRET=dev-rating-secret-change-me
    depends_on:
      - auth-service
      - ml-service
      - customization-service
      - rating-service
    ports:
      - "8085:8085"

  rating-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/rating-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - AUTH_SERVICE_URL=http://auth-service:8081
      - RATING_INTERNAL_SECRET=dev-rating-secret-change-me
      - DEFAULT_QUEUE_TYPE=duel
      - DEFAULT_REGION=global
    depends_on:
      - mysql
      - auth-service
    ports:
      - "8086:8086"

  customization-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/customization-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CUSTOMIZATION_INTERNAL_SECRET=dev-customization-secret-change-me
      - ADMIN_API_SECRET=dev-admin-secret-change-me
      - DEFAULT_RESULT_SOUND_URL=https://cdn.chadchat.example/sounds/default_win.mp3
    depends_on:
      - mysql
      - auth-service
    ports:
      - "8087:8087"

  admin-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/admin-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - ADMIN_API_SECRET=dev-admin-secret-change-me
      - AUTH_SERVICE_URL=http://auth-service:8081
      - VERIFICATION_SERVICE_URL=http://verification-service:8082
      - TEST_LAB_SERVICE_URL=http://test-lab-service:8083
      - LIVE_CHAT_SERVICE_URL=http://live-chat-service:8084
      - DUEL_SERVICE_URL=http://duel-service:8085
      - RATING_SERVICE_URL=http://rating-service:8086
      - CUSTOMIZATION_SERVICE_URL=http://customization-service:8087
      - ML_SERVICE_URL=http://ml-service:8090
    depends_on:
      - mysql
      - auth-service
      - verification-service
      - test-lab-service
      - live-chat-service
      - duel-service
      - rating-service
      - customization-service
    ports:
      - "8088:8088"

  profile-service:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/profile-service
    environment:
      - MYSQL_DSN=app:app@tcp(mysql:3306)/chadchat?parseTime=true&multiStatements=true&charset=utf8mb4
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      - mysql
      - auth-service
      - rating-service
      - customization-service
    ports:
      - "8089:8089"

  api-gateway:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/api-gateway
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - VERIFICATION_SERVICE_URL=http://verification-service:8082
      - TEST_LAB_SERVICE_URL=http://test-lab-service:8083
      - LIVE_CHAT_SERVICE_URL=http://live-chat-service:8084
      - DUEL_SERVICE_URL=http://duel-service:8085
      - RATING_SERVICE_URL=http://rating-service:8086
      - CUSTOMIZATION_SERVICE_URL=http://customization-service:8087
      - ADMIN_SERVICE_URL=http://admin-service:8088
      - PROFILE_SERVICE_URL=http://profile-service:8089
      - ML_SERVICE_URL=http://ml-service:8090
    depends_on:
      - auth-service
      - verification-service
      - test-lab-service
      - live-chat-service
      - duel-service
      - rating-service
      - customization-service
      - admin-service
      - profile-service
    ports:
      - "8080:8080"

volumes:
  mysql_data:
