name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_DEPLOY_PATH: /opt/chadchat/api
  WEB_DEPLOY_PATH: /opt/chadchat/web

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - 'deploy/web/**'
              - '.github/workflows/deploy.yml'
            api:
              - 'backend/**'
              - 'ml/**'
              - 'deploy/api/**'
              - '.github/workflows/deploy.yml'

  build-and-push-web:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize owner
        id: vars
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/chadchat-web:main
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/chadchat-web:${{ github.sha }}

  build-and-push-api:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: api-gateway
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE_PATH=./cmd/api-gateway
          - image_name: auth-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE_PATH=./cmd/auth-service
          - image_name: verification-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE_PATH=./cmd/verification-service
          - image_name: test-lab-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE_PATH=./cmd/test-lab-service
          - image_name: live-chat-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE_PATH=./cmd/live-chat-service
          - image_name: duel-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE_PATH=./cmd/duel-service
          - image_name: ml-service
            context: ./ml
            dockerfile: ./ml/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Normalize owner
        id: vars
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,scope=${{ matrix.image_name }},mode=max
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/chadchat-${{ matrix.image_name }}:main
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/chadchat-${{ matrix.image_name }}:${{ github.sha }}

  deploy-api:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-push-api
    if: needs.detect-changes.outputs.api == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Normalize owner
        id: vars
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Copy API compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.API_SSH_USER }}
          key: ${{ secrets.API_SSH_KEY }}
          port: ${{ secrets.API_SSH_PORT || '22' }}
          source: deploy/api/docker-compose.yml
          target: ${{ env.API_DEPLOY_PATH }}
          strip_components: 2

      - name: Deploy API stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          OWNER_LC: ${{ steps.vars.outputs.owner_lc }}
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.API_SSH_USER }}
          key: ${{ secrets.API_SSH_KEY }}
          port: ${{ secrets.API_SSH_PORT || '22' }}
          envs: OWNER_LC
          script: |
            set -eu
            mkdir -p "${{ env.API_DEPLOY_PATH }}"
            cat > "${{ env.API_DEPLOY_PATH }}/.env" <<EOF
            CORS_ALLOWED_ORIGINS=${{ secrets.PROD_API_CORS_ALLOWED_ORIGINS }}
            API_PUBLIC_PORT=${{ vars.PROD_API_PUBLIC_PORT || '8080' }}
            AUTH_ACCESS_TOKEN_SECRET=${{ secrets.PROD_AUTH_ACCESS_TOKEN_SECRET }}
            AUTH_REFRESH_TOKEN_SECRET=${{ secrets.PROD_AUTH_REFRESH_TOKEN_SECRET }}
            VERIFICATION_INTERNAL_SECRET=${{ secrets.PROD_VERIFICATION_INTERNAL_SECRET }}
            API_GATEWAY_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-api-gateway:main
            AUTH_SERVICE_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-auth-service:main
            VERIFICATION_SERVICE_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-verification-service:main
            TEST_LAB_SERVICE_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-test-lab-service:main
            LIVE_CHAT_SERVICE_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-live-chat-service:main
            DUEL_SERVICE_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-duel-service:main
            ML_SERVICE_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-ml-service:main
            EOF
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            cd "${{ env.API_DEPLOY_PATH }}"
            docker compose pull
            docker compose up -d

  deploy-web:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-and-push-web
    if: needs.detect-changes.outputs.web == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Normalize owner
        id: vars
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Copy web compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WEB_SSH_HOST }}
          username: ${{ secrets.WEB_SSH_USER }}
          key: ${{ secrets.WEB_SSH_KEY }}
          port: ${{ secrets.WEB_SSH_PORT || '22' }}
          source: deploy/web/docker-compose.yml
          target: ${{ env.WEB_DEPLOY_PATH }}
          strip_components: 2

      - name: Deploy web stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          OWNER_LC: ${{ steps.vars.outputs.owner_lc }}
        with:
          host: ${{ secrets.WEB_SSH_HOST }}
          username: ${{ secrets.WEB_SSH_USER }}
          key: ${{ secrets.WEB_SSH_KEY }}
          port: ${{ secrets.WEB_SSH_PORT || '22' }}
          envs: OWNER_LC
          script: |
            set -eu
            mkdir -p "${{ env.WEB_DEPLOY_PATH }}"
            cat > "${{ env.WEB_DEPLOY_PATH }}/.env" <<EOF
            VITE_API_BASE_URL=${{ vars.PROD_API_BASE_URL }}
            WEB_PUBLIC_PORT=${{ vars.PROD_WEB_PUBLIC_PORT || '80' }}
            WEB_IMAGE=${{ env.REGISTRY }}/${OWNER_LC}/chadchat-web:main
            EOF
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            cd "${{ env.WEB_DEPLOY_PATH }}"
            docker compose pull
            docker compose up -d
